<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="pad">
      <rect x="120" y="60" width="760" height="462" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1000" height="620" rx="28" fill="#0f1115"/>

  <!-- trackpad surface -->
  <rect x="120" y="60" width="760" height="462" rx="26" fill="#1b1e25"/>

  <g clip-path="url(#pad)">
    <!-- left: brightness -->
    <rect x="120" y="60" width="56" height="462" fill="#ff9f0a" fill-opacity="0.32"/>
    <!-- right: volume -->
    <rect x="824" y="60" width="56" height="462" fill="#0a84ff" fill-opacity="0.32"/>
    <!-- top: keyboard light -->
    <rect x="176" y="60" width="608" height="40" fill="#30d158" fill-opacity="0.30"/>
    <!-- corner: mute -->
    <rect x="784" y="60" width="96" height="66" fill="#1b1e25"/>
    <rect x="784" y="60" width="96" height="66" fill="#ff453a" fill-opacity="0.38"/>
    <!-- bottom: media (optional) -->
    <rect x="178" y="484" width="644" height="36" fill="#bf5af2" fill-opacity="0.14" stroke="#bf5af2" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  </g>
  <rect x="120" y="60" width="760" height="462" rx="26" fill="none" stroke="#3a3f4a" stroke-width="2"/>

  <!-- labels -->
  <text transform="translate(153 291) rotate(-90)" text-anchor="middle" fill="#ffb340" font-size="16" font-weight="700" letter-spacing="3">BRIGHTNESS</text>
  <text transform="translate(847 418) rotate(90)" text-anchor="middle" fill="#409cff" font-size="16" font-weight="700" letter-spacing="3">VOLUME</text>
  <text x="480" y="86" text-anchor="middle" fill="#30d158" font-size="15" font-weight="700" letter-spacing="2">◀  KEYBOARD LIGHT  ▶</text>
  <text x="832" y="92" text-anchor="middle" fill="#ff6961" font-size="15" font-weight="700" letter-spacing="2">MUTE</text>
  <text x="832" y="112" text-anchor="middle" fill="#ff6961" font-size="11.5">double-tap</text>
  <text x="500" y="507" text-anchor="middle" fill="#d08cf5" font-size="13" font-weight="600" letter-spacing="1">◀◀ PREV  ·  MEDIA STRIP (optional)  ·  NEXT ▶▶</text>

  <text x="500" y="286" text-anchor="middle" fill="#5d6472" font-size="20" font-weight="500">the rest of your trackpad</text>
  <text x="500" y="314" text-anchor="middle" fill="#5d6472" font-size="20" font-weight="500">works exactly as before</text>

  <!-- finger sliding up the right edge -->
  <line x1="852" y1="300" x2="852" y2="160" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M843,162 L852,146 L861,162 z" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="852" cy="300" r="17" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="852" cy="300" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- side annotations -->
  <text x="60" y="296" text-anchor="middle" fill="#ffb340" font-size="30">☀︎</text>
  <text x="60" y="332" text-anchor="middle" fill="#8a909c" font-size="12">slide</text>
  <text x="940" y="296" text-anchor="middle" fill="#409cff" font-size="26">♪</text>
  <text x="940" y="332" text-anchor="middle" fill="#8a909c" font-size="12">slide</text>

  <text x="500" y="572" text-anchor="middle" fill="#8a909c" font-size="16">Slide one finger along an edge. Two fingers still scroll like normal.</text>
</svg>
